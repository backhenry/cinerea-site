<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Uma peça Cinérea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2EFEA; --ash:#E7E3DC; --char:#1C1A17; --ember:#B5462A;
    --smoke:#6E6862; --line:#D8D2C8;
    --surface:rgba(255,255,255,.55); --shadow:rgba(28,26,23,.07);
  }
  /* A peça é objeto de fim de tarde: o modo escuro não é um tema à parte, é a
     mesma paleta virada do avesso. A brasa continua sendo a brasa. */
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#141311; --ash:#1F1D1A; --char:#F0EDE7; --smoke:#9A938A;
      --line:#312D28; --surface:rgba(255,255,255,.04); --shadow:rgba(0,0,0,.4);
      /* A brasa clareia no escuro. O #B5462A sobre este fundo dá 2,4:1 —
         serve para um ponto decorativo, não para um link que se lê. */
      --ember:#D9663F;
    }
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--paper); color:var(--char);
    font-family:'Inter',sans-serif; line-height:1.6; -webkit-font-smoothing:antialiased;
    /* Um halo quente no topo, como a luz de uma vela acesa acima da peça. */
    background-image:radial-gradient(120% 55% at 50% -8%, rgba(181,70,42,.09), transparent 62%);
    background-attachment:fixed;
  }
  .tudo{
    min-height:100svh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:40px 22px 32px; text-align:center; gap:0;
  }
  /* `currentColor` no traço + esta cor: a marca vira clara no modo escuro
     sozinha. Com a cor fixa no SVG ela ficava carvão sobre carvão — invisível.
     A brasa do ponto continua brasa: ela funciona nos dois fundos. */
  svg.marca{width:40px;height:40px;color:var(--char)}
  /* A brasa respira enquanto a peça abre — é o único movimento da página. */
  svg.marca circle{transform-origin:center; animation:brasa 2.6s ease-in-out infinite}
  .pronto svg.marca circle{animation:none}
  @keyframes brasa{0%,100%{opacity:1}50%{opacity:.35}}

  /* O `align-items:center` do pai faz os filhos encolherem para o conteúdo.
     Sem isto o cartão media 223px numa tela de 390 — e o `width:100%` dele
     passava a valer sobre uma largura já encolhida. */
  #corpo{width:100%;display:flex;flex-direction:column;align-items:center}

  .rot{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--smoke)}
  .titulo{font-family:'Fraunces';font-weight:300;font-size:clamp(30px,9vw,44px);line-height:1.1;word-break:break-word}

  /* O conteúdo ganha superfície: separa a mensagem da peça do resto da página. */
  .conteudo{
    margin-top:30px; width:100%; max-width:420px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:18px; padding:30px 24px;
    box-shadow:0 1px 2px var(--shadow), 0 12px 32px -18px var(--shadow);
  }
  .conteudo .rot{margin-bottom:14px}

  .cta{
    display:block; margin-top:22px; padding:17px 22px;
    background:var(--char); color:var(--paper); text-decoration:none;
    border-radius:12px; font-size:15px; font-weight:500; letter-spacing:.01em;
    border:none; width:100%; cursor:pointer; font-family:inherit;
    transition:background .18s ease, transform .18s ease;
  }
  .cta:hover{background:var(--ember)}
  .cta:active{transform:scale(.985)}
  .cta:focus-visible{outline:2px solid var(--ember); outline-offset:3px}

  .recado{
    font-family:'Fraunces'; font-style:italic; font-weight:300;
    font-size:clamp(20px,5.6vw,26px); line-height:1.45;
  }
  /* Aspas tipográficas grandes, em brasa, para o recado parecer dito e não exibido. */
  .recado::before{
    content:'\201C'; display:block; font-size:40px; line-height:.85;
    margin:2px 0 6px; color:var(--ember); opacity:.45;
  }
  .rede{font-family:'Fraunces';font-weight:400;font-size:clamp(24px,6.4vw,30px);line-height:1.2;word-break:break-word}
  .senha{
    margin-top:16px; font-family:ui-monospace,'SF Mono',Menlo,monospace;
    font-size:19px; letter-spacing:.06em; word-break:break-all;
  }
  .nota{margin-top:14px;font-size:13px;color:var(--smoke);line-height:1.5}

  /* A lista de endereços. Um por linha, alvo grande: quem abriu isto está de pé,
     numa festa, com uma mão só. */
  .links{display:flex;flex-direction:column;gap:9px}
  .lk{
    display:flex;align-items:center;gap:12px;padding:14px 16px;
    border:1px solid var(--line);border-radius:12px;text-decoration:none;
    color:var(--char);font-size:15px;font-weight:500;
    transition:border-color .18s ease,transform .18s ease;
  }
  .lk:hover{border-color:var(--ember);color:var(--ember)}
  .lk:active{transform:scale(.99)}
  .lk svg{width:21px;height:21px;flex:0 0 auto}
  .lk span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* A certidão é um selo, não mais uma seção: recuada e em superfície de cinza. */
  .certidao{
    margin-top:26px; width:100%; max-width:420px;
    background:var(--ash); border-radius:14px; padding:22px 24px;
  }
  .proc{font-family:'Fraunces';font-weight:400;font-size:18px;margin-top:8px;line-height:1.3}
  /* Os dois caminhos que a peça abre para quem a recebeu: comprar a sua, e
     repor a areia quando esta acabar. Secundários de propósito — o conteúdo
     que o dono deixou é o assunto, isto é o convite. */
  .caminhos{margin-top:14px;width:100%;max-width:420px;display:flex;flex-wrap:wrap;gap:10px}
  .caminho{
    flex:1 1 auto; padding:15px 18px; border-radius:12px;
    border:1px solid var(--line); background:transparent; color:var(--char);
    text-decoration:none; font-size:14px; font-weight:500; text-align:center;
    transition:border-color .18s ease, color .18s ease;
  }
  .caminho:hover{border-color:var(--ember);color:var(--ember)}
  .caminho .sub{display:block;font-size:12px;font-weight:400;color:var(--smoke);margin-top:3px}

  .assinatura{margin-top:34px;font-size:12px;color:var(--smoke)}
  .assinatura a{color:var(--smoke)}
  .assinatura a.loja{color:var(--ember)}
  .carregando{color:var(--smoke);font-size:14px;margin-top:26px}

  /* Entrada suave: a peça "abre" em vez de aparecer de estalo. */
  .surge{animation:surge .5s cubic-bezier(.2,.7,.3,1) both}
  @keyframes surge{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .surge,svg.marca circle{animation:none}
  }
</style>
</head>
<body>
<main class="tudo">
  <svg class="marca" viewBox="0 0 150 150" fill="none" aria-hidden="true">
    <path d="M108 46 C97 31,70 28,53 42 C36 56,36 94,53 108 C70 122,97 119,108 104" stroke="currentColor" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="112" cy="75" r="11" fill="#B5462A"/>
  </svg>
  <div id="corpo"><p class="carregando" style="margin-top:28px">abrindo a peça…</p></div>
  <p class="assinatura">
    <a href="/">Cinérea</a> · feito à mão em Campos do Jordão
  </p>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Chave de app web não é segredo: ela vai em qualquer site. Quem protege é a
// regra do Firestore — `vitrines/` e `pecas/` são de leitura aberta de
// propósito, e nada mais desse projeto é.
const app = initializeApp({
  apiKey: "AIzaSyAdoiD3IU7CR-QzZjeAxwAyYLvcClfd-XQ",
  authDomain: "cinerea1.firebaseapp.com",
  projectId: "cinerea1",
  storageBucket: "cinerea1.firebasestorage.app",
  messagingSenderId: "458519504441",
  appId: "1:458519504441:web:b66d6dd2d8a2d497654fe8",
});
const fdb = getFirestore(app);
const corpo = document.getElementById('corpo');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/** O chip é identificado por `?c=`. Curto de propósito: cabe nos 504 bytes. */
const chip = new URLSearchParams(location.search).get('c');

function vazio(msg){
  corpo.innerHTML = `<p class="rot" style="margin-top:26px">Cinérea</p>
    <p class="titulo">Uma peça</p><p class="nota">${esc(msg)}</p>`;
}

function abrirEm(url, rotulo){
  return `<a class="cta" href="${esc(url)}" rel="noopener">${esc(rotulo)}</a>`;
}

/**
 * Os símbolos das redes, desenhados aqui mesmo.
 *
 * Nenhum vem de fora de propósito: esta página abre no celular de quem encostou
 * numa peça, às vezes com sinal ruim, e uma dependência de terceiro seria mais
 * uma requisição para dar errado — além de contar a um estranho quem abriu a
 * peça. Traço fino, na cor do texto, para conviverem com a marca.
 */
const S = 'fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"';
const SIMBOLOS = {
  instagram: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5" ${S}/><circle cx="12" cy="12" r="4" ${S}/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor"/></svg>`,
  youtube:   `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" ${S}/><path d="M10.5 9.2 15 12l-4.5 2.8Z" ${S}/></svg>`,
  tiktok:    `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5" ${S}/><path d="M14 6.2c.9 1.6 2.4 2.6 4.4 2.7" ${S}/></svg>`,
  x:         `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20" ${S}/></svg>`,
  facebook:  `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 8.5h2.2M14.5 21V9.6c0-1.6.9-2.6 2.6-2.6h1.4" ${S}/><path d="M11 12.4h5.6" ${S}/></svg>`,
  linkedin:  `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3" ${S}/><path d="M7.5 10.5V17M7.5 7.4v.1M11.5 17v-3.4a2 2 0 0 1 4 0V17" ${S}/></svg>`,
  spotify:   `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" ${S}/><path d="M7.6 9.4c3-.7 6-.4 8.3.9M8.2 12.6c2.4-.5 4.8-.3 6.7.8M8.8 15.6c1.9-.4 3.7-.2 5.2.6" ${S}/></svg>`,
  whatsapp:  `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-3.4-6.5" ${S}/><path d="M20 4v4.2h-4.2" ${S}/><path d="M4.6 19.4 6 15.6" ${S}/></svg>`,
  pinterest: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" ${S}/><path d="M10.4 20l2-8.4" ${S}/><path d="M9.2 13.6c-.9-2.6.6-5 3.1-5 2 0 3.3 1.4 3.3 3.3 0 2.3-1.3 4-3 4-1 0-1.7-.7-1.5-1.6" ${S}/></svg>`,
  site:      `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" ${S}/><path d="M3.2 12h17.6M12 3.2c2.4 2.4 3.6 5.4 3.6 8.8S14.4 18.4 12 20.8c-2.4-2.4-3.6-5.4-3.6-8.8S9.6 5.6 12 3.2Z" ${S}/></svg>`,
  email:     `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5" ${S}/><path d="M3.6 7.2 12 13l8.4-5.8" ${S}/></svg>`,
  loja:      `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 9.5V19a1.5 1.5 0 0 0 1.5 1.5h12A1.5 1.5 0 0 0 19.5 19V9.5" ${S}/><path d="M3 9.5 5 4h14l2 5.5Z" ${S}/><path d="M9.5 20.5V14h5v6.5" ${S}/></svg>`,
};

function mostrar(v, cert){
  let bloco = '';
  if (!v) {
    bloco = `<p class="rot">Esta peça ainda não diz nada</p>
      <p class="nota" style="margin-top:0">Quem tem a peça escolhe o que ela guarda.</p>`;
  } else if (v.tipo === 'recado') {
    bloco = `<p class="rot">Recado</p><p class="recado">${esc(v.dados)}</p>`;
  } else if (v.tipo === 'wifi') {
    // A senha vem junto (decisão do dono, jul/2026): a Apple não implementa o
    // registro de wi-fi do NFC, então sem ela um convidado de iPhone não teria
    // como conectar. No Android o chip já conecta sozinho e esta página é
    // reforço.
    const senha = v.senha
      ? `<p class="senha">${esc(v.senha)}</p>
         <button class="cta" type="button" id="copiarSenha" data-senha="${esc(v.senha)}">
           Copiar a senha
         </button>`
      : `<p class="nota">Encoste o celular na peça para conectar.</p>`;
    bloco = `<p class="rot">Rede de wi-fi</p><p class="rede">${esc(v.dados)}</p>${senha}`;
  } else if (v.tipo === 'links') {
    // Vários endereços numa peça. Só existe no modo permanente — o chip guarda
    // esta página, e é aqui que a lista mora.
    const itens = Array.isArray(v.itens) ? v.itens.slice(0, 12) : [];
    bloco = `<p class="rot">${esc(v.titulo || 'Meus links')}</p>
      <div class="links">${itens.map(l => `
        <a class="lk" href="${esc(l.url)}" rel="noopener">
          ${SIMBOLOS[l.icone] || SIMBOLOS.site}
          <span>${esc(l.rotulo || l.icone || 'Abrir')}</span>
        </a>`).join('')}</div>`;
  } else if (v.tipo === 'contato') {
    bloco = `<p class="rot">Contato</p><p class="rede">${esc(v.dados)}</p>`;
  } else {
    const nomes   = {link:'Link', playlist:'Playlist', whatsapp:'WhatsApp', local:'Lugar'};
    const rotulos = {link:'Abrir o link', playlist:'Ouvir a playlist', whatsapp:'Falar no WhatsApp', local:'Ver no mapa'};
    bloco = `<p class="rot">${esc(nomes[v.tipo] || 'Conteúdo')}</p>
      ${abrirEm(v.dados, rotulos[v.tipo] || 'Abrir')}`;
  }

  let selo = '';
  if (cert) {
    const serie = cert.serie && cert.total ? `peça ${cert.serie} de ${cert.total}`
                : cert.serie ? `peça ${cert.serie}` : '';
    const feita = cert.feitaEm?.seconds
      ? new Date(cert.feitaEm.seconds * 1000).toLocaleDateString('pt-BR', {month:'long', year:'numeric'})
      : '';
    selo = `<div class="certidao surge" style="animation-delay:.08s">
      <p class="rot">Peça original</p>
      <p class="proc">${esc(cert.modelo || 'Cinérea')}${serie ? ' · ' + esc(serie) : ''}</p>
      ${feita ? `<p class="nota" style="margin-top:4px">feita em ${esc(feita)}</p>` : ''}
    </div>`;
  }

  // Onde repor a areia: o link da própria certidão quando a peça tem um (ele é
  // específico do modelo), e a coleção de refis da loja quando não tem.
  const ondeRepor = cert?.refil || '/loja/?colecao=Areia';
  const caminhos = `<div class="caminhos surge" style="animation-delay:.16s">
    <a class="caminho" href="${esc(ondeRepor)}" rel="noopener">
      Repor a areia<span class="sub">quando a fragrância acabar</span>
    </a>
    <a class="caminho" href="/loja/">
      Ver as peças<span class="sub">a loja da Cinérea</span>
    </a>
  </div>`;

  // `?pv=1` é a prévia da página inicial: mostra só o conteúdo. Os caminhos para
  // a loja não cabem num celular desenhado de 264px, e ali não são o assunto.
  const previa = new URLSearchParams(location.search).get('pv') === '1';
  corpo.innerHTML = `<div class="conteudo surge">${bloco}</div>${selo}${previa ? '' : caminhos}`;
  if (previa) document.querySelector('.assinatura')?.remove();
  // Para a brasa da marca parar de piscar: a peça já abriu.
  document.body.classList.add('pronto');

  // Copiar a senha do wi-fi. `writeText` exige contexto seguro (temos HTTPS) e
  // um gesto do usuário — por isso vive no clique, e não no carregamento.
  const botao = document.getElementById('copiarSenha');
  if (botao) {
    botao.addEventListener('click', async () => {
      const original = botao.textContent.trim();
      try {
        await navigator.clipboard.writeText(botao.dataset.senha);
        botao.textContent = 'Copiada';
      } catch {
        // Navegador sem permissão de área de transferência: a senha continua
        // visível na tela, que é o que importa. Não fingir que copiou.
        botao.textContent = 'Selecione e copie acima';
      }
      setTimeout(() => { botao.textContent = original; }, 1800);
    });
  }
}

/**
 * Pré-visualização dos estados, sem peça na mão: `/p/?demo=wifi`.
 *
 * Existe porque esta página só se vê com uma vitrine publicada, e desenhar às
 * cegas foi o que produziu os erros de layout deste projeto. Só responde quando
 * NÃO há `?c=` — nunca interfere numa peça de verdade.
 */
const DEMO = {
  link:     { tipo:'link',     dados:'https://exemplo.com' },
  playlist: { tipo:'playlist', dados:'https://open.spotify.com/playlist/37i9dQ' },
  whatsapp: { tipo:'whatsapp', dados:'https://wa.me/5512991234567' },
  local:    { tipo:'local',    dados:'https://maps.google.com/?q=Campos+do+Jord%C3%A3o' },
  wifi:     { tipo:'wifi',     dados:'Cinerea_Casa', senha:'gesso2026' },
  recado:   { tipo:'recado',   dados:'Que esta chama acompanhe vocês dois.' },
  contato:  { tipo:'contato',  dados:'Henrique Martins' },
  links:    { tipo:'links', titulo:'Meus links', itens:[
    { rotulo:'@cinerea.velas', url:'https://instagram.com/cinerea.velas', icone:'instagram' },
    { rotulo:'@cinerea.velas', url:'https://tiktok.com/@cinerea.velas',  icone:'tiktok' },
    { rotulo:'A loja',         url:'https://cinerea.com.br/loja/',       icone:'loja' },
    { rotulo:'Falar comigo',   url:'https://wa.me/5511958280174',        icone:'whatsapp' },
  ]},
  vazia:    null,
};

const demo = new URLSearchParams(location.search).get('demo');
if (!chip && demo && demo in DEMO) {
  // `&sem=cert` mostra a peça sem certidão: é o caso de quem ainda não teve a
  // procedência registrada, e o que faz o botão de refil cair na coleção da loja.
  const busca = new URLSearchParams(location.search);
  const semCert = busca.get('sem') === 'cert';

  // `&t=` troca o conteúdo pelo texto de quem está experimentando. É o que
  // permite à página inicial mostrar a peça DELA, com as palavras DELA, dentro
  // de um celular desenhado. O texto entra pelo mesmo `esc()` do resto — vem
  // da barra de endereço, então é entrada não confiável como qualquer outra.
  const proprio = busca.get('t');
  const base = DEMO[demo];
  const conteudo = (proprio && base) ? { ...base, dados: proprio.slice(0, 220) } : base;

  mostrar(conteudo, semCert ? null
    : { modelo:'Apolo', serie:12, total:40, feitaEm:{ seconds: 1774000000 }, refil:'https://cinerea.com.br/loja/' });
} else if (!chip) {
  vazio('Encoste o celular numa peça Cinérea para abri-la.');
} else {
  try {
    const [vit, cert] = await Promise.all([
      getDoc(doc(fdb, 'vitrines', chip)).catch(() => null),
      getDoc(doc(fdb, 'pecas', chip)).catch(() => null),
    ]);
    if (!vit?.exists() && !cert?.exists()) {
      vazio('Não encontramos esta peça.');
    } else {
      mostrar(vit?.exists() ? vit.data() : null, cert?.exists() ? cert.data() : null);
    }
  } catch {
    vazio('Não consegui abrir a peça agora. Tente de novo com internet.');
  }
}
</script>
</body>
</html>
